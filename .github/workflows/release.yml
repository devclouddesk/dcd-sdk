name: Release & Publish Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      target:
        description: 'Which registry to publish to'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - npm
          - pypi

jobs:
  publish-npm:
    name: Publish to NPM (@dcd-sdk/storage-client)
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'npm'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 with NPM registry
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies & Build
        run: |
          npm ci || npm install
          npm run build

      - name: Run Test Suite (Block publish on failure)
        run: npm run test

      - name: Publish @dcd-sdk/storage-client to NPM
        run: |
          cd packages/storage-client
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-pypi:
    name: Publish to PyPI (dcd-storage-client)
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'pypi'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Python Unit Tests (Block publish on failure)
        run: |
          cd python
          python -m unittest discover -s tests -p "test_*.py"

      - name: Install build tools
        run: pip install build twine

      - name: Build Python distribution
        run: |
          cd python
          python -m build
          twine check dist/*

      - name: Publish to PyPI via Twine
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          twine upload python/dist/* --non-interactive --skip-existing
