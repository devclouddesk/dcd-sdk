[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dcd-storage-client"
version = "1.0.1"
description = "Official Python client SDK for DevCloudDesk Storage Engine"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "DevCloudDesk", email = "support@devclouddesk.com" }
]
keywords = [
    "devclouddesk",
    "storage",
    "cdn",
    "image-transformation",
    "s3",
    "media-engine",
    "cloudinary-alternative"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Software Development :: Libraries :: Python Modules"
]

[project.urls]
Homepage = "https://devclouddesk.com"
Documentation = "https://docs.devclouddesk.com/storage"
Repository = "https://github.com/devclouddesk/dcd-sdk"
